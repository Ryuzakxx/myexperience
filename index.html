<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b14;
    --surface: #13101f;
    --border: #2a1f4a;
    --purple: #a855f7;
    --purple-dim: #7c3aed;
    --purple-glow: #c084fc;
    --accent-rgb: 168, 85, 247;
    --text: #e2d9f3;
    --text-dim: #9d8fc4;
    --text-muted: #5c4f7a;
    --line-num: #3d3060;
    --orange: #fb923c;
    --green: #4ade80;
    --cyan: #22d3ee;
    --font-mono: 'Fira Code', 'Share Tech Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(var(--accent-rgb), 0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 82% 78%, rgba(var(--accent-rgb), 0.09) 0%, transparent 55%),
      radial-gradient(ellipse 40% 40% at 55% 45%, rgba(var(--accent-rgb), 0.05) 0%, transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(var(--accent-rgb), 0.015) 2px,
      rgba(var(--accent-rgb), 0.015) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .editor {
    width: 100%;
    max-width: 780px;
    background:
      radial-gradient(circle at 84% 16%, rgba(var(--accent-rgb), 0.09) 0%, transparent 48%),
      linear-gradient(165deg, rgba(var(--accent-rgb), 0.06) 0%, rgba(19, 16, 31, 0.96) 35%, rgba(19, 16, 31, 0.98) 100%);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(var(--accent-rgb), 0.1),
      0 0 40px rgba(var(--accent-rgb), 0.08),
      0 0 80px rgba(var(--accent-rgb), 0.04),
      0 20px 60px rgba(0,0,0,0.6);
    animation: fadeIn 0.6s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .titlebar {
    background: #0f0c1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red    { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green  { background: #28c840; }

  .tab {
    margin-left: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 4px 14px;
    border-radius: 4px 4px 0 0;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    font-family: var(--font-mono);
  }

  .tab.lang-switch {
    cursor: pointer;
    color: var(--text-muted);
    background: transparent;
    border-color: transparent;
    transition: color 0.2s, border-color 0.2s, background 0.2s, text-shadow 0.2s;
    user-select: none;
  }
  .tab.lang-switch:hover {
    color: var(--purple-glow);
    border-color: rgba(var(--accent-rgb), 0.35);
    background: rgba(var(--accent-rgb), 0.06);
    text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.5);
  }

  .theme-picker {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .theme-picker label {
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .theme-picker select {
    background: linear-gradient(
      180deg,
      rgba(var(--accent-rgb), 0.22) 0%,
      rgba(8, 12, 24, 0.94) 100%
    );
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    color: #f6f3ff;
    padding: 5px 8px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    outline: none;
    cursor: pointer;
  }
  .theme-picker select option {
    background: #0f1424;
    color: #f6f3ff;
  }
  .theme-picker select:focus {
    box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.6);
  }

  .code-body { display: flex; }

  .gutter {
    padding: 20px 0;
    min-width: 48px;
    text-align: right;
    border-right: 1px solid var(--border);
    user-select: none;
    background: #0f0c1a;
  }
  .gutter span {
    display: block;
    padding: 0 12px 0 8px;
    color: var(--line-num);
    font-size: 11px;
    line-height: 1.7;
    font-family: var(--font-mono);
  }

  .content {
    padding: 20px 24px;
    flex: 1;
    overflow-x: auto;
    position: relative;
    opacity: 1;
    transition: opacity 0.15s ease;
  }
  .content.fading { opacity: 0; }

  .mascot {
    position: absolute;
    top: 16px;
    right: 20px;
    width: 90px;
    height: 90px;
    object-fit: contain;
    image-rendering: pixelated;
    opacity: 0.80;
    filter:
      drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.75))
      drop-shadow(0 0 20px rgba(var(--accent-rgb), 0.35));
    transition: opacity 0.3s, filter 0.35s, transform 0.35s;
  }
  .mascot:hover {
    opacity: 1;
    transform: scale(1) translateY(-1.5px);
    filter:
      drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.62))
      drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.36));
  }

  .cv-open  { color: var(--purple); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .cv-close { color: var(--purple); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }

  .name {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-top: 6px;
    letter-spacing: 0.03em;
  }
  .role { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  .section-title {
    color: var(--purple);
    font-size: 14px;
    font-weight: 500;
    margin: 18px 0 6px;
    letter-spacing: 0.06em;
    display: inline-block;
    transition: color 0.2s, text-shadow 0.2s;
    cursor: default;
  }
  .section-title::before { content: '.'; }
  .section-title:hover {
    color: var(--purple-glow);
    text-shadow: 0 0 12px rgba(192,132,252,0.5);
  }

  .about-text {
    color: var(--text-dim);
    font-size: 12px;
    max-width: 560px;
    line-height: 1.8;
  }

  .edu-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 32px;
    margin-bottom: 4px;
    align-items: baseline;
  }
  .edu-name { color: var(--text); font-size: 12px; font-weight: 500; }
  .edu-period {
    color: var(--purple-glow);
    font-size: 11px;
    font-style: italic;
    text-shadow:
      0 0 6px rgba(var(--accent-rgb), 0.514),
      0 0 16px rgba(var(--accent-rgb), 0.5),
      0 0 32px rgba(255, 255, 255, 0.2);
  }
  .edu-period:hover { cursor: wait; }
  .edu-sub { color: var(--text-dim); font-size: 11px; }

  .project-list { list-style: none; }
  .project-list li {
    display: grid;
    grid-template-columns: 140px 14px 1fr;
    gap: 0 6px;
    align-items: baseline;
    line-height: 1.9;
    font-size: 12px;
  }
  .project-list li .proj-name {
    color: var(--cyan);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .project-list li .proj-dash { color: var(--text-muted); }
  .project-list li .proj-desc { color: var(--text-dim); }

  a {
    color: inherit;
    text-decoration: none;
    transition: color 0.2s, text-shadow 0.25s;
  }
  a:hover {
    color: #ffffff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.9),
      0 0 16px rgba(255,255,255,0.5),
      0 0 32px rgba(255,255,255,0.2);
  }

  i {
    font-style: italic;
    color: rgba(136,136,136,0.911);
    transition: color 0.2s, text-shadow 0.25s;
  }
  i:hover {
    color: #ffffff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.9),
      0 0 16px rgba(255,255,255,0.5),
      0 0 32px rgba(255,255,255,0.2);
    cursor: progress;
  }

  .comp-list { list-style: none; }
  .comp-list li { font-size: 12px; line-height: 1.9; color: var(--text-dim); }
  .comp-list li b { color: var(--orange); font-weight: 500; }
  .comp-list li .comp-link { color: var(--purple-glow); }

  .skills-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .skill-tag {
    background: rgba(var(--accent-rgb), 0.1);
    border: 1px solid rgba(var(--accent-rgb), 0.25);
    color: var(--purple-glow);
    padding: 2px 10px;
    border-radius: 3px;
    font-size: 11px;
    transition: background 0.2s, border-color 0.2s;
  }
  .skill-tag:hover {
    background: rgba(var(--accent-rgb), 0.2);
    border-color: rgba(var(--accent-rgb), 0.5);
  }

  .extra-list { list-style: none; }
  .extra-list li { font-size: 12px; line-height: 1.9; color: var(--text-dim); }
  .extra-list li b { color: var(--green); }

  /* ── Certifications ── */
  .cert-list { list-style: none; }
  .cert-list li { font-size: 12px; line-height: 1.9; color: var(--text-dim); }
  .cert-list li .cert-name {
    color: var(--green);
    font-weight: 500;
    transition: color 0.2s, text-shadow 0.25s;
  }
  .cert-list li a:hover .cert-name {
    color: #ffffff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.9),
      0 0 16px rgba(255,255,255,0.5),
      0 0 32px rgba(255,255,255,0.2);
  }
  .cert-list li .cert-issuer {
    color: var(--text-muted);
    font-size: 11px;
    margin-left: 6px;
  }

  .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  .caret {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--purple);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  @media (max-width: 540px) {
    .theme-picker {
      width: 100%;
      margin-left: 0;
      justify-content: flex-end;
    }
    .content { padding: 16px; }
    .name { font-size: 16px; }
    .cv-open, .cv-close { font-size: 20px; }
    .project-list li { grid-template-columns: 110px 14px 1fr; }
    .mascot { width: 60px; height: 60px; top: 12px; right: 12px; }
  }
</style>
</head>

    accentDim: '#ea580c',
    accentGlow: '#fdba74',
    accentRgb: '251, 146, 60',
    border: '#4a2c14',
    mascot: {
      name: 'Charizard',
      sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png'
    }
  },
  rose: {
    labelIt: 'Rosa - Jigglypuff',
    labelEn: 'Pink - Jigglypuff',
    accent: '#f472b6',
    accentDim: '#db2777',
    accentGlow: '#f9a8d4',
    accentRgb: '244, 114, 182',
    border: '#4b1f36',
    mascot: {
      name: 'Jigglypuff',
      sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/39.png'
    }
  }
};

let lang = 'it';
let themeKey = 'violet';

function initThemePicker() {
  const select = document.getElementById('theme-select');
  const labelKey = lang === 'en' ? 'labelEn' : 'labelIt';
  select.innerHTML = Object.entries(THEMES)
    .map(([key, theme]) => `<option value="${key}">${theme[labelKey]}</option>`)
    .join('');
  select.value = themeKey;
}

function setTheme(nextKey) {
  const nextTheme = THEMES[nextKey] || THEMES.violet;
  themeKey = THEMES[nextKey] ? nextKey : 'violet';

  const root = document.documentElement;
  root.style.setProperty('--purple', nextTheme.accent);
  root.style.setProperty('--purple-dim', nextTheme.accentDim);
  root.style.setProperty('--purple-glow', nextTheme.accentGlow);
  root.style.setProperty('--accent-rgb', nextTheme.accentRgb);
  root.style.setProperty('--border', nextTheme.border);

  const mascot = document.getElementById('mascot');
  mascot.src = nextTheme.mascot.sprite;
  mascot.alt = nextTheme.mascot.name;
  mascot.title = nextTheme.mascot.name;
}

function render(t) {
  document.getElementById('tab-active').textContent       = t.tabActive;
  document.getElementById('tab-switch').textContent       = t.tabSwitch;
  document.getElementById('role').innerHTML               = t.role;
  document.getElementById('lbl-about').textContent        = t.about;
  document.getElementById('lbl-edu').textContent          = t.edu;
  document.getElementById('lbl-projects').textContent     = t.projects;
  document.getElementById('lbl-competitions').textContent = t.competitions;
  document.getElementById('lbl-skills').textContent       = t.skills;
  document.getElementById('lbl-certs').textContent        = t.certs;
  document.getElementById('lbl-extra').textContent        = t.extra;
  document.getElementById('lbl-socials').textContent      = t.socials;
  document.getElementById('theme-label').textContent      = t.themeLabel;
  initThemePicker();
  document.getElementById('edu-name').textContent         = t.eduName;
  document.getElementById('edu-period').textContent       = t.eduPeriod;

  document.getElementById('about-text').innerHTML =
    t.aboutText + '<span class="caret"></span>';

  document.getElementById('project-list').innerHTML =
    t.projectList.map(p => `<li>
      <span class="proj-name">${p.name}</span>
      <span class="proj-dash">&mdash;</span>
      <span class="proj-desc">${p.desc}</span>
    </li>`).join('');

  document.getElementById('comp-list').innerHTML =
    t.compList.map(c => `<li>${c}</li>`).join('');

  document.getElementById('cert-list').innerHTML =
    t.certList.map(c => `<li>
      <a href="${c.file}" target="_blank" rel="noopener">
        <span class="cert-name">${c.name}</span>
      </a>
      <span class="cert-issuer">— ${c.issuer}</span>
    </li>`).join('');

  document.getElementById('extra-list').innerHTML =
    t.extraList.map(e => `<li>${e}</li>`).join('');

  document.documentElement.lang = lang;
  updateGutter();
}

function toggleLang() {
  const el = document.getElementById('cv-content');
  el.classList.add('fading');
  setTimeout(() => {
    lang = lang === 'it' ? 'en' : 'it';
    render(T[lang]);
    el.classList.remove('fading');
  }, 150);
}

/* ── Gutter ── */
const content = document.getElementById('cv-content');
const gutter  = document.getElementById('gutter');

function updateGutter() {
  const lineHeight = 13 * 1.7;
  const lines = Math.ceil(content.scrollHeight / lineHeight);
  gutter.innerHTML = '';
  for (let i = 1; i <= lines + 4; i++) {
    const s = document.createElement('span');
    s.textContent = i;
    gutter.appendChild(s);
  }
}

render(T[lang]);
initThemePicker();
setTheme(themeKey);
window.addEventListener('resize', updateGutter);
</script>

</body>
</html>
